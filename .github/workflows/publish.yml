name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          if (pkg.private === true) {
            throw new Error("Confirm the npm package name and remove private: true before releasing.");
          }
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error(`Release tag must match package.json: v${pkg.version}`);
          }
          if (pkg.version.includes("-")) {
            throw new Error("This workflow only publishes stable versions.");
          }
          NODE

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - run: npm ci
      - run: npm run iso:ingest-xml
      - run: git diff --exit-code -- src/data.ts
      - run: npm run check

      - name: Publish with npm trusted publishing
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ""
